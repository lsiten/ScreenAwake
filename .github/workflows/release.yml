name: Build desktop releases

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target aarch64-apple-darwin
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: npm ci
      - if: matrix.os == 'macos-latest'
        run: npm run tauri build -- --bundles app --target aarch64-apple-darwin
      - if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          app="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/ScreenAwake.app"
          dmg="src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/ScreenAwake_0.1.2_aarch64.dmg"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          mkdir -p "$(dirname "$dmg")"
          hdiutil create -volname ScreenAwake -srcfolder "$app" -ov -format UDZO "$dmg"
      - if: matrix.os == 'windows-latest'
        run: npm run tauri build
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe
